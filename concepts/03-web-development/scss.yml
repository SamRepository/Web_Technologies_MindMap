definition: SCSS is a syntax of SASS (Syntactically Awesome Style Sheets), a CSS preprocessor that extends
  the capabilities of CSS. It allows developers to use variables, nested rules, mixins, and functions,
  making CSS more maintainable, reusable, and easier to write. SCSS is fully compatible with the original
  CSS syntax, making it a more powerful way to organize and streamline stylesheets in web development
  projects.
