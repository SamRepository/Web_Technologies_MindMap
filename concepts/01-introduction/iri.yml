definition: IRI is an extension of the Uniform Resource Identifier (URI) that allows for the inclusion
  of non-ASCII characters. IRIs enable the use of characters from multiple languages and scripts, such
  as accented letters, Chinese, Arabic, or Cyrillic, within web addresses. This provides a more inclusive
  and globally accessible format for resource identification on the internet. IRIs can be converted to
  URIs for backward compatibility with systems that only support ASCII characters.
