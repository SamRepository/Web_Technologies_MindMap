definition: The Domain Name System (DNS) translates human-friendly domain names into IP addresses required
  for locating and identifying computer services and devices.
definition_ar: >-
  نظام أسماء النطاقات (DNS) يترجم أسماء النطاقات المفهومة للإنسان إلى عناوين بروتوكول الإنترنت
  (IP addresses) اللازمة لتحديد موقع خدمات الحاسوب والأجهزة والتعرّف عليها.
