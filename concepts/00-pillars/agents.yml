definition: In computer science, an agent is an entity capable of autonomous action in an environment.
  Agents can be humans, software-based (e.g., chatbots, intelligent agents) or hardware-based (e.g., robots).
  They perform tasks such as decision-making, learning, and interacting with other agents or systems.
