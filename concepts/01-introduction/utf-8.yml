definition: UTF-8 (Unicode Transformation Format - 8-bit) is a variable-width character encoding used
  for electronic communication. It can encode all possible characters (code points) in Unicode using one
  to four bytes. UTF-8 is backward-compatible with ASCII and is widely used on the web for text representation
  due to its efficiency in encoding common characters and its compatibility across different systems.
