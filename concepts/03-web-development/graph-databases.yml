definition: A graph database is a type of NoSQL database that uses graph structures with nodes, edges,
  and properties to represent and store data. It is optimized for handling data with complex relationships
  and is particularly useful in applications like social networks, recommendation engines, and fraud detection.
  Nodes represent entities, while edges represent the relationships between those entities, making querying
  and navigating complex interconnected data efficient.
definition_ar: >-
  قاعدة البيانات الرسمية نوع من قواعد NoSQL يستعمل بُنى الرسوم من عقد وحوافّ وخصائص لتمثيل
  البيانات وتخزينها. وهي محسَّنة للتعامل مع البيانات ذات العلاقات المعقّدة، ومفيدة بوجه خاصّ
  في تطبيقات كالشبكات الاجتماعية ومحرّكات التوصية وكشف الاحتيال. تمثّل العقد الكيانات، وتمثّل
  الحوافّ العلاقات بينها، ممّا يجعل الاستعلام عن البيانات المترابطة المعقّدة والتنقّل فيها
  أمرًا كفؤًا.
