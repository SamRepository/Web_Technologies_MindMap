definition: 'A utility-first CSS framework: instead of writing custom stylesheets, you compose small single-purpose
  classes directly in the markup. It takes the opposite approach to component frameworks like Bootstrap,
  trading readable HTML for the removal of the naming and dead-CSS problems that grow with a hand-written
  stylesheet.'
