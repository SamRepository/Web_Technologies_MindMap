definition: A typed superset of JavaScript that compiles to plain JavaScript. Types are checked before
  the code runs and then erased, so TypeScript catches a whole class of errors at build time while shipping
  ordinary JavaScript to the browser. It is now the default choice for large front-end and Node codebases.
definition_ar: >-
  مجموعة عليا مُنمَّطة من جافاسكريبت (JavaScript) تُترجَم إلى جافاسكريبت عادية. تُفحَص الأنواع
  (types) قبل تشغيل الشيفرة ثم تُحذَف، فتلتقط TypeScript صنفًا كاملًا من الأخطاء وقت البناء
  بينما تُرسل إلى المتصفّح جافاسكريبت عادية. وهي اليوم الخيار الافتراضي لقواعد الشيفرة الكبيرة
  في الواجهة الأمامية وفي Node.
