definition: Hypertext Transfer Protocol (HTTP) is the foundation of data communication on the World Wide
  Web, while HTTPS is the secure version using encryption.
definition_ar: >-
  بروتوكول نقل النصّ الفائق (HTTP) هو أساس تبادل البيانات على الشبكة العنكبوتية العالمية
  (World Wide Web)، أمّا HTTPS فهو نسخته الآمنة التي تستخدم التشفير (encryption).
