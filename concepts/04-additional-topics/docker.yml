definition: Docker is a set of platform-as-a-service products that use OS-level virtualization to deliver
  software in packages called containers.
definition_ar: >-
  دوكر مجموعة من منتجات المنصّة كخدمة (PaaS) تستخدم المحاكاة الافتراضية على مستوى نظام التشغيل
  (OS-level virtualization) لتسليم البرمجيات في حزم تُسمّى الحاويات (containers).
