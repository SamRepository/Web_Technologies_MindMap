definition: Retrieving relevant documents and supplying them to a language model as context before it
  answers. It grounds answers in a specific corpus, which reduces fabrication and lets a model use information
  it was never trained on without retraining.
definition_ar: >-
  استرجاع المستندات ذات الصلة وتزويد نموذج لغوي (language model) بها كسياق قبل أن يجيب. يُرسي
  هذا الإجابات في مدوَّنة نصوص محدَّدة، ما يقلّل الاختلاق ويتيح للنموذج استخدام معلومات لم
  يُدرَّب عليها قطّ دون إعادة تدريبه.
