definition: Unicode, Inc., commonly known as the Unicode Consortium, is a non-profit organization that
  develops and maintains the Unicode Standard, a universal character encoding scheme for text representation
  across different platforms and devices. This standard is essential for enabling consistent text data
  interchange across the internet and other platforms.
definition_ar: >-
  يونيكود المسجَّلة، المعروفة باسم اتّحاد يونيكود، منظّمة غير ربحية تطوّر معيار يونيكود
  وتصونه، وهو نظام ترميز محارف عالمي لتمثيل النصّ عبر المنصّات والأجهزة المختلفة. وهذا المعيار
  أساسيّ لإتاحة تبادل بيانات النصّ باتّساق عبر الإنترنت وغيره من المنصّات.
