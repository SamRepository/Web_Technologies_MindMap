name: Deploy site to GitHub Pages

# Requires Pages to be enabled once, by hand, in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Until that is done this workflow will fail at the deploy step. Nothing in the
# repository can enable it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-flight one, but never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Deploying stale pages would publish something that does not match the
      # concept data, so the same gate as CI applies before anything ships.
      - name: Generated output is not stale
        run: python scripts/build.py --check

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
