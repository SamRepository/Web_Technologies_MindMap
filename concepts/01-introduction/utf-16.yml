definition: UTF-16 (Unicode Transformation Format - 16-bit) is another character encoding used to encode
  Unicode characters. It uses either one or two 16-bit code units to encode characters. While UTF-16 is
  more efficient for encoding characters beyond the Basic Multilingual Plane (BMP), it is less commonly
  used than UTF-8 for web content.
