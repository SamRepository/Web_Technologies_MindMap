definition: Virtualization is the process of creating virtual instances of physical resources, such as
  servers, storage, or networks. By using software like hypervisors, multiple virtual machines (VMs) can
  run on a single physical machine, optimizing resource use and providing flexibility in cloud environments.
  Virtualization is a key technology in cloud computing, enabling efficient allocation of computing resources
  and isolation of environments for security and scalability.
definition_ar: >-
  المحاكاة الافتراضية عملية إنشاء نُسَخ افتراضية من الموارد المادّية كالخواديم والتخزين
  والشبكات. وباستعمال برمجيات كمراقبات الأجهزة الافتراضية (hypervisors) يمكن تشغيل عدّة أجهزة
  افتراضية (VMs) على آلة مادّية واحدة، ممّا يحسّن استغلال الموارد ويوفّر مرونة في بيئات
  السحابة. وهي تقنية أساسية في الحوسبة السحابية، تتيح تخصيص موارد الحوسبة بكفاءة وعزل البيئات
  لأغراض الأمن وقابلية التوسّع.
