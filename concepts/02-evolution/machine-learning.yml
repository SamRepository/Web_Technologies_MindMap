definition: Machine learning is a subset of AI that involves training models to recognize patterns in
  data and make predictions or decisions based on that data. It enables systems to learn from experience
  and improve over time without being explicitly programmed.
definition_ar: >-
  تعلُّم الآلة فرع من الذكاء الاصطناعي (AI) يقوم على تدريب النماذج على التعرّف إلى الأنماط في
  البيانات وإصدار تنبّؤات أو قرارات بناءً عليها. وهو يمكّن الأنظمة من التعلّم بالتجربة
  والتحسّن مع الوقت دون برمجتها صراحةً.
