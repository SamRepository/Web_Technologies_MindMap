definition: Client-side refers to operations that are performed by the client, which in most cases is
  the user's web browser. Client-side technologies include HTML, CSS, and JavaScript, which are executed
  on the user's device rather than on the server. This approach allows for dynamic user interfaces and
  interactive web experiences.
