id: import-maps
label: Import Maps
section: 03-web-development
subsection: front-end-development
parent: esm
order: 1022
level: null
status: emerging
definition: A JSON block in the page that tells the browser how to resolve bare module names such as `import
  'lodash'` to real URLs. It allows a project to use named imports directly in the browser without a bundler
  rewriting them first.
definition_ar: >-
  كتلة JSON داخل الصفحة تخبر المتصفّح كيف يحلّ أسماء الوحدات المجرّدة، مثل import 'lodash'،
  إلى عناوين حقيقية. وتتيح للمشروع استعمال الاستيرادات المسمّاة مباشرةً في المتصفّح دون حاجة
  إلى مُحزِّم يعيد كتابتها أوّلًا.
