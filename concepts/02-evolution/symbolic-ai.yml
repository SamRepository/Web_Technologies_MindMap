definition: Symbolic AI uses explicit, human-readable rules and logic to perform reasoning tasks. It relies
  on symbolic representations of knowledge and logical inference to simulate intelligent behavior, commonly
  seen in expert systems.
definition_ar: >-
  الذكاء الاصطناعي الرمزي يستعمل قواعد ومنطقًا صريحًا مقروءًا للإنسان لأداء مهامّ الاستدلال.
  ويعتمد على تمثيلات رمزية للمعرفة وعلى الاستنتاج المنطقي لمحاكاة السلوك الذكي، وهو ما نراه
  عادةً في النظم الخبيرة.
