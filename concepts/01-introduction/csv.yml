definition: CSV is a simple file format used to store tabular data, such as a spreadsheet or database.
  Each line in a CSV file corresponds to a record, and each field in the record is separated by a comma.
  CSV files are commonly used for data exchange between different systems and applications due to their
  simplicity and wide support.
