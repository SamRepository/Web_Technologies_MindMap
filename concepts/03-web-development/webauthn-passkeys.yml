parent: defenses
order: 1072
level: null
status: current
see_also:
- phishing
definition: A standard for signing in with public-key cryptography instead of a shared secret. The private
  key never leaves the user's device, so there is no password for a site to leak or an attacker to phish.
  Passkeys are WebAuthn credentials synchronised across a user's devices.
definition_ar: >-
  معيار لتسجيل الدخول بتعمية المفتاح العامّ بدل سرّ مشترك. لا يغادر المفتاح الخاصّ جهاز
  المستخدم قطّ، فلا توجد كلمة سرّ يسرّبها موقع أو يصطادها مهاجم. ومفاتيح المرور (Passkeys)
  اعتمادات WebAuthn متزامنة عبر أجهزة المستخدم.
