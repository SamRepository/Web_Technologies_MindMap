definition: A typed superset of JavaScript that compiles to plain JavaScript. Types are checked before
  the code runs and then erased, so TypeScript catches a whole class of errors at build time while shipping
  ordinary JavaScript to the browser. It is now the default choice for large front-end and Node codebases.
