<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Technologies Mind Map</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1a1a19; --muted:#6b6b68; --line:#c9c9c4; --panel:#fff;
  --accent:#3b6ea5; --emerging:#8a5cb8; --legacy:#9a9a95; --hit:#c9761d;
  --rel:#c9761d;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  /* One hue per top-level section, used to colour graph nodes. */
  --s0:#3b6ea5; --s1:#2e8b74; --s2:#b4653a; --s3:#8a5cb8; --s4:#a03d5f; --s5:#6b7a2e;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a19; --fg:#e8e8e4; --muted:#9a9a94; --line:#3d3d3a; --panel:#232322;
    --accent:#7aa8d4; --emerging:#b48ad8; --legacy:#5f5f5b; --hit:#e0a060;
    --rel:#e0a060;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --s0:#7aa8d4; --s1:#5cc0a4; --s2:#e0a06a; --s3:#b48ad8; --s4:#d97a9a; --s5:#a8bb5e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;
  padding:.6rem .9rem;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:.95rem;font-weight:650;margin:0;white-space:nowrap}
#search{flex:1;min-width:11rem;max-width:22rem;padding:.35rem .6rem;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:.35rem .6rem;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
#tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
#tabs button{border:0;border-radius:0;padding:.35rem .8rem}
#tabs button+button{border-left:1px solid var(--line)}
#tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
#xlinks[aria-pressed="true"]{border-color:var(--rel);color:var(--rel)}
#count{color:var(--muted);font-size:.8rem;white-space:nowrap}
.legend{display:flex;gap:.7rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.25rem}
.legend s{display:inline-block;width:1.1rem;border-top:1px solid var(--line);
  margin-right:.25rem;vertical-align:middle}
.legend s.rel{border-top:1.5px dashed var(--rel)}
main{flex:1;display:flex;min-height:0}
/* touch-action must be on the wrapper as well as the svg. iOS Safari looks at
   the element the gesture *starts* on and its ancestors; with the wrapper left
   at `auto` it can claim a two-finger gesture for its own page zoom and cancel
   our pointers mid-pinch. -webkit-touch-callout stops the long-press menu
   appearing over a node during a drag. */
#canvas{flex:1;overflow:hidden;position:relative;cursor:grab;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#canvas.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block;touch-action:none}

/* -- tree view ------------------------------------------------------- */
.edge{fill:none;stroke:var(--line);stroke-width:1.2}
.node{cursor:pointer}
.node text{font-size:12.5px;fill:var(--fg);dominant-baseline:middle;user-select:none}
.node circle{fill:var(--bg);stroke:var(--accent);stroke-width:1.6}
.node.section text{font-weight:650}
.node.section circle{fill:var(--accent)}
.node.has-kids circle{fill:var(--accent)}
.node.collapsed circle{fill:var(--bg);stroke-dasharray:2 1.5}
.node.emerging circle{stroke:var(--emerging)}
.node.legacy circle{stroke:var(--legacy)}
.node.legacy text{fill:var(--legacy);font-style:italic}
.node.dim{opacity:.22}
.node.hit circle{stroke:var(--hit);stroke-width:2.6}
.node.hit text{fill:var(--hit);font-weight:650}
.node.sel text{text-decoration:underline;text-underline-offset:3px}

/* -- graph view ------------------------------------------------------ */
.gedge{stroke:var(--line);stroke-width:1;stroke-opacity:.75}
/* Cross-links are deliberately quiet at rest -- there are more of them than
   there are sections, and at full strength they read as noise over the
   hierarchy. Focusing a node brings the relevant ones forward. */
.gedge.rel{stroke:var(--rel);stroke-width:1.1;stroke-dasharray:4 3;stroke-opacity:.42}
.gedge.rel.lit{stroke-width:1.7;stroke-opacity:1}
body.no-xlinks .gedge.rel{display:none}
.gnode{cursor:pointer}
.gnode circle{stroke:var(--panel);stroke-width:1.2}
.gnode.emerging circle{stroke:var(--emerging);stroke-width:2;stroke-dasharray:2.5 2}
.gnode.legacy{opacity:.6}
.gnode text{font-size:10.5px;fill:var(--fg);text-anchor:middle;user-select:none;
  pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;
  stroke-linejoin:round}
.gnode.big text{font-size:12.5px;font-weight:650}
.gnode.legacy text{font-style:italic}
.gnode.sel circle,.gnode.hit circle{stroke:var(--hit);stroke-width:2.6}
.gnode.hushed{opacity:.12}
.gedge.hushed{stroke-opacity:.06}
/* Toggling the view hides the other layer's controls rather than removing
   them, so no state is lost when switching back and forth. */
body[data-mode="graph"] .tree-only,body[data-mode="tree"] .graph-only{display:none}
body[data-mode="graph"] #view,body[data-mode="tree"] #gview{display:none}

#panel{width:22rem;max-width:42vw;border-left:1px solid var(--line);background:var(--panel);
  padding:1rem;overflow-y:auto}
#panel.empty{color:var(--muted);font-size:.85rem}
#panel h2{font-size:1rem;margin:0 0 .15rem}
#panel .path{font-size:.75rem;color:var(--muted);margin-bottom:.7rem}
#panel .badge{display:inline-block;font-size:.7rem;padding:.05rem .4rem;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);margin-left:.35rem;vertical-align:middle}
#panel p.def{margin:.4rem 0 .9rem}
#panel ul{margin:0;padding-left:1.1rem}
#panel li{margin:.2rem 0}
#panel a{color:var(--accent)}
#panel .locked{color:var(--muted)}
#panel h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);margin:1rem 0 .3rem;font-weight:650}
#panel .jump{background:none;border:0;padding:0;color:var(--rel);cursor:pointer;
  font:inherit;text-align:left;text-decoration:underline;text-underline-offset:2px}
@media (max-width:720px){
  main{flex-direction:column}
  #panel{width:auto;max-width:none;border-left:0;border-top:1px solid var(--line);max-height:42%}
}
</style>
<div id="app">
  <header>
    <h1>Web Technologies Mind Map</h1>
    <span id="tabs">
      <button id="tab-tree" aria-pressed="true">Tree</button>
      <button id="tab-graph" aria-pressed="false">Graph</button>
    </span>
    <input id="search" type="search" placeholder="Search concepts and definitions…" autocomplete="off">
    <button id="expand" class="tree-only">Expand all</button>
    <button id="collapse" class="tree-only">Collapse</button>
    <button id="xlinks" class="graph-only" aria-pressed="true">Cross-links</button>
    <button id="relayout" class="graph-only">Re-run layout</button>
    <button id="reset">Reset view</button>
    <span id="count"></span>
    <span class="legend">
      <span><i style="background:var(--accent)"></i>current</span>
      <span><i style="background:var(--emerging)"></i>emerging</span>
      <span><i style="background:var(--legacy)"></i>legacy</span>
    </span>
    <span class="legend graph-only">
      <span><s></s>hierarchy</span>
      <span><s class="rel"></s>related</span>
    </span>
  </header>
  <main>
    <div id="canvas"><svg><g id="view"></g><g id="gview"></g></svg></div>
    <aside id="panel" class="empty">Select a node to see its definition and resources.</aside>
  </main>
</div>
<script>
const DATA = {"id":"root","label":"Web Technologies Mind Map","kind":"section","status":"current","children":[{"id":"section--00-pillars","label":"Top-Level Pillar Concepts","kind":"section","status":"current","def":"This section covers high-level concepts that are fundamental to understanding the structure and development of computer science. Each concept plays a vital role in the computing ecosystem, from the design and interaction of systems to the paradigms and trends driving technological advancements.","children":[{"id":"agents","label":"Agents","status":"current","def":"In computer science, an agent is an entity capable of autonomous action in an environment. Agents can be humans, software-based (e.g., chatbots, intelligent agents) or hardware-based (e.g., robots). They perform tasks such as decision-making, learning, and interacting with other agents or systems.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Intelligent_agent"}]},{"id":"organizations","label":"Organizations","status":"current","def":"Organizations refer to structured groups that develop, manage, and implement technology solutions. They can be companies, governmental institutions, or non-profit entities. Technology-focused organizations include standards bodies like ISO, IEEE, and W3C, as well as corporations like Google and Microsoft.","rel":["w3c-consortium"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Organization"}]},{"id":"humans","label":"Humans","status":"current","def":"Humans are the end-users and creators of technology. Human-Computer Interaction (HCI) focuses on designing systems that are accessible, user-friendly, and effective for human use.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Human%E2%80%93computer_interaction"}]},{"id":"machines","label":"Machines","status":"current","def":"Machines refer to computing devices, including servers, personal computers, mobile and networking devices, and IoT devices, that process data, execute instructions, and perform automated tasks.","rel":["devices"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Machine"}]},{"id":"data","label":"Data","status":"current","def":"Data is information that is processed, stored, and transmitted by computing systems. It can be structured (e.g., databases), semi-structured (e.g., XML, Json, RDF) or unstructured (e.g., multimedia content), and is the core of all digital systems.","rel":["data-encoding","data-exchange-formats","databases-2"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Data"}]},{"id":"algorithms","label":"Algorithms","status":"current","def":"Algorithms are sets of instructions or rules designed to perform specific tasks or solve problems efficiently. They are the foundation of programming and automation in computing.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Algorithm"}]},{"id":"languages","label":"Languages","status":"current","def":"Programming languages are formal languages used to instruct machines on how to perform tasks. Popular languages include Python, PHP, C++, and JavaScript.","rel":["programming","javascript"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Programming_language"}]},{"id":"interfaces","label":"Interfaces","status":"current","def":"Interfaces are the points of interaction between users and systems or between different systems themselves. This includes languages, graphical user interfaces (GUIs) and application programming interfaces (APIs).","rel":["restful-apis","graphql"],"links":[{"label":"Wikipedia - GUIs","url":"https://en.wikipedia.org/wiki/Graphical_user_interface"},{"label":"Wikipedia - APIs","url":"https://en.wikipedia.org/wiki/API"}]},{"id":"software","label":"Software","status":"current","def":"Software consists of programs and operating systems that direct hardware to perform specific tasks. Software is categorized into system software (e.g., operating systems) and application software (e.g., word processors).","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Software"}]},{"id":"frameworks","label":"Frameworks","status":"current","def":"Frameworks are collections of pre-written code that provide a foundation for building applications. They streamline development by offering reusable components and patterns, such as Odoo, Django, and Flask.","rel":["frameworks-and-libraries","web-frameworks"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Software_framework"}]},{"id":"paradigms","label":"Paradigms","status":"current","def":"Paradigms are philosophical approaches or models of programming and system design, such as Object-Oriented Programming (OOP), Functional Programming, and Agile Methodology.","rel":["oop"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Programming_paradigm"}]},{"id":"trends","label":"Trends","status":"current","def":"Trends represent emerging technologies and methodologies in the tech industry. Examples include Knowledge Graphs, AI/ML, edge computing, serverless architectures, and blockchain.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Technology_trend"}]},{"id":"disciplines","label":"Disciplines","status":"current","def":"Disciplines are specialized fields of study within computer science and engineering that guide research and development in specific areas, such as AI, cybersecurity, and networking.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Computer_science"}]}]},{"id":"section--00-disciplines","label":"Main Computer Science Disciplines","kind":"section","status":"current","def":"The following section delves into the primary disciplines of computer science. Each discipline focuses on a specific area of computing, contributing to the development of technology that powers our digital world.","children":[{"id":"computer-architecture","label":"Computer Architecture","status":"current","def":"The design and organization of computer systems, including processors, memory, and input/output devices, ensuring efficient execution of instructions.","rel":["server","webassembly"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Computer_architecture"}]},{"id":"algorithmic","label":"Algorithmic","status":"current","def":"The study and development of algorithms, which are central to solving computational problems and optimizing performance in programming and systems.","rel":["algorithms"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Algorithm"}]},{"id":"operating-systems","label":"Operating Systems","status":"current","def":"The management of hardware and software resources on a computer. Operating systems control the execution of applications, manage memory, and provide essential services.","rel":["virtualization","docker"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Operating_system"}]},{"id":"networking","label":"Networking","status":"current","def":"The field focused on the design, implementation, and management of communication between computers and devices over networks, including the internet.","rel":["networking-2","tcp-ip"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Computer_network"}]},{"id":"programming","label":"Programming","status":"current","def":"The discipline of writing code to create software applications and systems using programming languages such as Python, Java, and C++.","rel":["oop","server-side-programming"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Computer_programming"}]},{"id":"databases","label":"Databases","status":"current","def":"The study and management of databases, including the design, optimization, and querying of systems that store and organize large amounts of data.","rel":["databases-2","sql"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Database"}]},{"id":"information-systems","label":"Information Systems","status":"current","def":"The integration of information technology and business processes to manage and use data effectively in organizations for decision-making and operations.","rel":["erp-systems","odoo-framework"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Information_system"}]},{"id":"software-engineering","label":"Software Engineering","status":"current","def":"The discipline focused on the systematic design, development, testing, and maintenance of software systems. It applies engineering principles to ensure software reliability, scalability, and maintainability throughout the software development life cycle (SDLC).","rel":["software","agile","devops"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Software_engineering"}]},{"id":"artificial-intelligence","label":"Artificial Intelligence","status":"current","def":"The branch of computer science focused on creating systems that mimic human intelligence, including machine learning, natural language processing, and robotics.","rel":["ai","machine-learning"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Artificial_intelligence"}]},{"id":"cyber-security","label":"Cyber Security","status":"current","def":"The practice of protecting computers, networks, and data from cyber threats, including unauthorized access, attacks, and data breaches.","rel":["threats","defenses"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Computer_security"}]}]},{"id":"section--01-introduction","label":"Introduction to Web Technologies","kind":"section","status":"current","def":"","children":[{"id":"01-introduction--internet-basics","label":"Internet Basics","kind":"section","status":"current","children":[{"id":"networking-2","label":"Networking","status":"current","children":[{"id":"devices","label":"Devices","status":"current","children":[{"id":"pc-mobile","label":"PC/Mobile","status":"current","def":"Personal computers (PCs) and mobile devices (smartphones and tablets) are end-user devices used to access the internet and run applications. PCs typically offer more processing power and flexibility, while mobile devices provide portability and convenience.","links":[{"label":"Wikipedia - PC","url":"https://en.wikipedia.org/wiki/Personal_computer"},{"label":"Wikipedia - Mobile Devices","url":"https://en.wikipedia.org/wiki/Mobile_device"}]},{"id":"server","label":"Server","status":"current","def":"A server is a computer or system that provides resources, data, services, or programs to other computers, known as clients, over a network. Servers are essential for hosting websites, applications, databases, and other online services.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Server_(computing)"}]},{"id":"switch","label":"Switch","status":"current","def":"A network switch is a device that connects devices within a network by using packet switching to receive, process, and forward data to the destination device. Switches operate at the data link layer (Layer 2) of the OSI model.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Network_switch"}]},{"id":"router","label":"Router","status":"current","def":"A router is a networking device that forwards data packets between computer networks, typically connected to at least two networks (e.g., LAN and WAN). Routers determine the best path for data to travel from source to destination.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Router_(computing)"}]}]},{"id":"protocols","label":"Protocols","status":"current","children":[{"id":"tcp-ip","label":"TCP/IP","status":"current","def":"The foundational communication protocols of the internet, responsible for routing and ensuring data integrity across networks.","links":[{"label":"Official Documentation","url":"https://www.ietf.org/standards/rfcs/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Internet_protocol_suite"}]},{"id":"dns","label":"DNS","status":"current","def":"The Domain Name System (DNS) translates human-friendly domain names into IP addresses required for locating and identifying computer services and devices.","links":[{"label":"Official Website","url":"https://www.iana.org/domains/root"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Domain_Name_System"}]},{"id":"http-https","label":"HTTP/HTTPS","status":"current","def":"Hypertext Transfer Protocol (HTTP) is the foundation of data communication on the World Wide Web, while HTTPS is the secure version using encryption.","links":[{"label":"Official Documentation","url":"https://www.w3.org/Protocols/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol"},{"label":"Training Course - Pluralsight","url":"https://drive.google.com/drive/folders/1-08W2MmXEgds8Ayn1_mrFKK3JB0JtU1Y"}],"children":[{"id":"http-2","label":"HTTP/2","status":"current","def":"A major revision of HTTP that keeps the same semantics but changes how messages travel: requests are multiplexed over a single connection and headers are compressed, removing the need for the workarounds sites used to hide HTTP/1.1's one-request-at-a-time behaviour.","links":[{"label":"RFC 9113","url":"https://httpwg.org/specs/rfc9113.html"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/HTTP/2"}]},{"id":"http-3","label":"HTTP/3","status":"current","def":"The current major version of HTTP, carried over QUIC instead of TCP. Because each stream is independent, a single lost packet no longer stalls every other request on the connection, which matters most on mobile and lossy networks.","links":[{"label":"RFC 9114","url":"https://httpwg.org/specs/rfc9114.html"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/HTTP/3"}],"children":[{"id":"quic","label":"QUIC","status":"current","def":"A transport protocol built on UDP that provides the reliability, congestion control and encryption that TCP plus TLS provide, but with a faster handshake and independent streams. It is the transport underneath HTTP/3.","links":[{"label":"RFC 9000","url":"https://datatracker.ietf.org/doc/html/rfc9000"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/QUIC"}]}]}]}]}]},{"id":"data-encoding","label":"Data Encoding","status":"current","children":[{"id":"unicode","label":"Unicode","status":"current","def":"A standard for consistent encoding, representation, and handling of text expressed in most of the world's writing systems.","links":[{"label":"Official Website","url":"https://home.unicode.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Unicode"}],"children":[{"id":"utf-8","label":"UTF-8","status":"current","def":"UTF-8 (Unicode Transformation Format - 8-bit) is a variable-width character encoding used for electronic communication. It can encode all possible characters (code points) in Unicode using one to four bytes. UTF-8 is backward-compatible with ASCII and is widely used on the web for text representation due to its efficiency in encoding common characters and its compatibility across different systems.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/UTF-8"}]},{"id":"utf-16","label":"UTF-16","status":"current","def":"UTF-16 (Unicode Transformation Format - 16-bit) is another character encoding used to encode Unicode characters. It uses either one or two 16-bit code units to encode characters. While UTF-16 is more efficient for encoding characters beyond the Basic Multilingual Plane (BMP), it is less commonly used than UTF-8 for web content.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/UTF-16"}]}]}]},{"id":"data-acces","label":"Data Acces","status":"current","children":[{"id":"uri-url","label":"URI/URL","status":"current","def":"Uniform Resource Identifier (URI) and Uniform Resource Locator (URL) are standardized methods to identify and locate resources on the web.","rel":["restful-apis"],"links":[{"label":"Official Documentation","url":"https://tools.ietf.org/html/rfc3986"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Uniform_Resource_Identifier"}]},{"id":"iri","label":"IRI (Internationalized Resource Identifier)","status":"current","def":"IRI is an extension of the Uniform Resource Identifier (URI) that allows for the inclusion of non-ASCII characters. IRIs enable the use of characters from multiple languages and scripts, such as accented letters, Chinese, Arabic, or Cyrillic, within web addresses. This provides a more inclusive and globally accessible format for resource identification on the internet. IRIs can be converted to URIs for backward compatibility with systems that only support ASCII characters.","rel":["unicode"],"links":[{"label":"Official Documentation","url":"https://www.w3.org/International/O-URL-and-ident.html"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Internationalized_Resource_Identifier"}]}]},{"id":"data-exchange-formats","label":"Data Exchange Formats","status":"current","children":[{"id":"xml","label":"XML","status":"current","def":"Extensible Markup Language (XML) is a flexible way to create common information formats and share data across the internet.","rel":["qweb"],"links":[{"label":"Official Documentation","url":"https://www.w3.org/XML/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/XML"},{"label":"Training Course - LinkedIn","url":"https://drive.google.com/drive/folders/12jb9iion-lCvHaJTKK7tKtvmKDJmjoOI"}],"children":[{"id":"xpath","label":"XPath (XML Path Language)","status":"current","def":"XPath is a query language for selecting nodes from an XML document. It provides a way to navigate through elements and attributes in an XML document using a path-like syntax. XPath is widely used in conjunction with XSLT, XQuery, and other XML technologies to retrieve specific parts of XML data.","links":[{"label":"W3C Documentation","url":"https://www.w3.org/TR/xpath-31/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/XPath"}]}]},{"id":"json","label":"JSON","status":"current","def":"JavaScript Object Notation (JSON) is a lightweight data-interchange format that is easy for humans to read and write, and easy for machines to parse and generate.","rel":["restful-apis"],"links":[{"label":"Official Documentation","url":"https://www.json.org/json-en.html"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/JSON"}]},{"id":"csv","label":"CSV (Comma-Separated Values)","status":"current","def":"CSV is a simple file format used to store tabular data, such as a spreadsheet or database. Each line in a CSV file corresponds to a record, and each field in the record is separated by a comma. CSV files are commonly used for data exchange between different systems and applications due to their simplicity and wide support.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Comma-separated_values"}]}]}]},{"id":"01-introduction--standardizing-entities","label":"Standardizing Entities","kind":"section","status":"current","children":[{"id":"w3c-consortium","label":"W3C Consortium (World Wide Web Consortium)","status":"current","def":"The World Wide Web Consortium (W3C) has central Role in Standardizing Web Technologiesis. W3C is an international community that develops open standards to ensure the long-term growth of the web. W3C is responsible for creating and maintaining many of the key standards used to build websites, including HTML, CSS, and XML, ensuring the interoperability and accessibility of web technologies.","rel":["html5","rdf-rdfs","web-components"],"links":[{"label":"Official Website","url":"https://www.w3.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/World_Wide_Web_Consortium"}]},{"id":"unicode-inc","label":"Unicode, Inc. (Unicode Consortium)","status":"current","def":"Unicode, Inc., commonly known as the Unicode Consortium, is a non-profit organization that develops and maintains the Unicode Standard, a universal character encoding scheme for text representation across different platforms and devices. This standard is essential for enabling consistent text data interchange across the internet and other platforms.","rel":["unicode"],"links":[{"label":"Official Website","url":"https://home.unicode.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Unicode_Consortium"}]},{"id":"iso","label":"ISO (International Organization for Standardization)","status":"current","def":"ISO is an independent, non-governmental international organization that develops and publishes a wide range of standards across various industries. These standards ensure quality, safety, efficiency, and interoperability for products, systems, and services. ISO standards are crucial in areas like technology, web development, and data management.","links":[{"label":"Official Website","url":"https://www.iso.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/International_Organization_for_Standardization"}]},{"id":"ieee","label":"IEEE (Institute of Electrical and Electronics Engineers)","status":"current","def":"IEEE is the world's largest technical professional organization focused on advancing technology. It is widely recognized for creating standards in a variety of areas such as computing, networking, and electronics. IEEE standards help ensure interoperability, innovation, and quality across numerous technologies.","links":[{"label":"Official Website","url":"https://www.ieee.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Institute_of_Electrical_and_Electronics_Engineers"}]}]}]},{"id":"section--02-evolution","label":"Evolution of the Web","kind":"section","status":"current","def":"","children":[{"id":"02-evolution--web-1-0-documents-web","label":"Web 1.0 - Documents Web","kind":"section","status":"current","children":[{"id":"static-web-pages","label":"Static Web Pages","status":"current","def":"Early web pages that were simple, static, and delivered via HTML, without any dynamic features or interactivity.","rel":["jamstack","astro"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_1.0"}]},{"id":"basic-html","label":"Basic HTML","status":"current","def":"The foundational markup language used for creating static web pages during the early days of the internet.","rel":["html5"],"links":[{"label":"Official Specification","url":"https://www.w3.org/TR/html401/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/HTML"}]},{"id":"e-mail","label":"E-mail","status":"current","def":"An electronic mail system that became one of the first uses of the Internet. It allows users to send and receive messages and files electronically over a network.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Email"}]},{"id":"search-engines","label":"Search Engines","status":"current","def":"Search engines are software systems designed to carry out web searches, allowing users to find information on the World Wide Web. They work by crawling, indexing, and ranking web pages based on relevant queries. Popular search engines include Google, Bing, and Yahoo.","rel":["seo"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Search_engine"}]}]},{"id":"02-evolution--web-2-0-social-web","label":"Web 2.0 - Social Web","kind":"section","status":"current","children":[{"id":"dynamic-and-interactive-web","label":"Dynamic and Interactive Web","status":"current","def":"Web 2.0 introduced user interaction and dynamic content, moving beyond static pages to more engaging websites.","rel":["javascript","spas"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_2.0"}]},{"id":"social-media-integration","label":"Social Media Integration","status":"current","def":"The era when social media platforms became central to online interaction, integrating with various web services and sites.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Social_media"}]}]},{"id":"02-evolution--web-3-0-semantic-web","label":"Web 3.0 - Semantic Web","kind":"section","status":"current","children":[{"id":"web3-disambiguation","label":"Web3 vs Web 3.0 — a note on terminology","status":"current","def":"These two terms are routinely confused, and they do not mean the same thing. In this mind map, and in academic usage, **Web 3.0** means the *Semantic Web*: the W3C programme of making data machine-readable through RDF, ontologies and linked data, so that software can reason over meaning rather than parse layout. **Web3** is a separate, later coinage from the cryptocurrency industry, describing blockchain-based decentralised applications and token ownership. The two agendas share the ambition of decentralisation but almost nothing else: different standards bodies, different technologies, different research communities. When you read \"Web 3.0\" in a tutorial, check which one is meant.","rel":["linked-data","blockchain-and-decentralization","knowledge-graphs"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Semantic_Web"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web3"}]},{"id":"blockchain-and-decentralization","label":"Blockchain and Decentralization","status":"current","def":"The concept of distributing data across multiple nodes or networks to enhance security and reduce centralization, often associated with blockchain technology.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Decentralized_web"}]},{"id":"linked-data","label":"Linked Data","status":"current","def":"A method of publishing structured data so that it can be interlinked and become more useful through semantic queries.","rel":["uri-url"],"links":[{"label":"Official Website","url":"https://www.w3.org/standards/semanticweb/data"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Linked_data"}],"children":[{"id":"rdf-rdfs","label":"RDF/ RDFS","status":"current","def":"Resource Description Framework (RDF) and RDF Schema (RDFS) are standards for describing resources on the web in a machine-readable way.","rel":["xml"],"links":[{"label":"Official Documentation","url":"https://www.w3.org/RDF/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Resource_Description_Framework"}]},{"id":"owl","label":"OWL","status":"current","def":"Web Ontology Language (OWL) is used to explicitly represent the meaning of terms in vocabularies and the relationships between those terms.","links":[{"label":"Official Documentation","url":"https://www.w3.org/OWL/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_Ontology_Language"}]},{"id":"sparql","label":"SPARQL","status":"current","def":"A query language for databases, able to retrieve and manipulate data stored in RDF format.","rel":["sql"],"links":[{"label":"Official Documentation","url":"https://www.w3.org/TR/sparql11-overview/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/SPARQL"}]},{"id":"swrl-rif","label":"SWRL/RIF","status":"current","def":"The Semantic Web Rule Language (SWRL) and Rule Interchange Format (RIF) are standards for expressing rules on the Web. SWRL allows users to write rules that can be applied to OWL ontologies, while RIF facilitates the interchange of rules among different systems.","links":[{"label":"SWRL Official Documentation","url":"https://www.w3.org/Submission/SWRL/"},{"label":"RIF Official Documentation","url":"https://www.w3.org/2005/rules/wiki/RIF_FAQ"},{"label":"Wikipedia - SWRL","url":"https://en.wikipedia.org/wiki/Semantic_Web_Rule_Language"},{"label":"Wikipedia - RIF","url":"https://en.wikipedia.org/wiki/Rule_Interchange_Format"},{"label":"Official Documentation","url":"https://www.w3.org/TR/sparql11-overview/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/SPARQL"}]},{"id":"knowledge-graphs","label":"Knowledge Graphs","status":"current","def":"A knowledge graph represents a network of real-world entities and illustrates the relationship between them.","rel":["graph-databases"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Knowledge_Graph"}]}]}]},{"id":"02-evolution--web-4-0-intelligent-web","label":"Web 4.0 - Intelligent Web","kind":"section","status":"current","children":[{"id":"ai","label":"AI (Artificial Intelligence)","status":"current","def":"AI refers to the simulation of human intelligence by machines, allowing them to perform tasks such as learning, reasoning, problem-solving, and decision-making. AI is increasingly integrated into web technologies to power smarter applications and services.","rel":["llm"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Artificial_intelligence"}],"children":[{"id":"symbolic-ai","label":"Symbolic AI","status":"current","def":"Symbolic AI uses explicit, human-readable rules and logic to perform reasoning tasks. It relies on symbolic representations of knowledge and logical inference to simulate intelligent behavior, commonly seen in expert systems.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Symbolic_artificial_intelligence"}]},{"id":"statistical-ai","label":"Statistical AI","status":"current","def":"Statistical AI focuses on data-driven approaches, using statistics and probability to model uncertainty and make predictions. Machine learning is a key component of statistical AI, relying on algorithms that improve with experience and data.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Statistical_learning_theory"}],"children":[{"id":"supervised-unsupervised-learning","label":"Supervised/Unsupervised Learning","status":"current","def":"Supervised learning involves training a machine learning model on labeled data, where the algorithm learns to map inputs to outputs. Unsupervised learning, on the other hand, involves discovering patterns in data without explicit labels, often used for clustering or anomaly detection.","links":[{"label":"Wikipedia - Supervised Learning","url":"https://en.wikipedia.org/wiki/Supervised_learning"},{"label":"Wikipedia - Unsupervised Learning","url":"https://en.wikipedia.org/wiki/Unsupervised_learning"}],"children":[{"id":"machine-learning","label":"Machine Learning (ML)","status":"current","def":"Machine learning is a subset of AI that involves training models to recognize patterns in data and make predictions or decisions based on that data. It enables systems to learn from experience and improve over time without being explicitly programmed.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Machine_learning"}]},{"id":"deep-learning","label":"Deep Learning","status":"current","def":"Deep learning is a subset of machine learning that uses neural networks with many layers (hence \"deep\") to model complex patterns in data. Deep learning is particularly effective for tasks such as image recognition, speech processing, and natural language understanding.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Deep_learning"}]}]},{"id":"nlp-nlu-and-nlg","label":"NLP (Natural Language Processing), NLU (Natural Language Understanding), and NLG (Natural Language Generation)","status":"current","children":[{"id":"nlp","label":"NLP","status":"current","def":"NLP is the field of AI focused on the interaction between computers and humans through natural language. It involves processing and analyzing large amounts of natural language data.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Natural_language_processing"}]},{"id":"nlu","label":"NLU","status":"current","def":"NLU is a subfield of NLP that focuses on the machine's ability to understand and interpret the meaning behind natural language inputs.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Natural-language_understanding"}]},{"id":"nlg","label":"NLG","status":"current","def":"NLG refers to the ability of AI systems to generate coherent and contextually appropriate natural language outputs based on data and inputs.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Natural-language_generation"}]}]},{"id":"autonomous-systems","label":"Autonomous Systems","status":"current","def":"Autonomous systems are machines or software that can perform tasks independently without human intervention, using AI and machine learning to make real-time decisions. Examples include robots, self-driving cars and automated customer service systems.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Autonomous_system"}]}]}]},{"id":"iot-ioe-integration","label":"IoT/IoE Integration (Internet of Things/Internet of Everything)","status":"current","def":"IoT refers to the network of physical objects embedded with sensors, software, and connectivity that allows them to collect and exchange data. IoE expands this concept to include people, processes, and data as well. These technologies are integrated into web applications to enhance automation, data-driven insights, and interconnectivity between smart devices.","rel":["devices"],"links":[{"label":"Wikipedia - IoT","url":"https://en.wikipedia.org/wiki/Internet_of_things"},{"label":"Wikipedia - IoE","url":"https://en.wikipedia.org/wiki/Internet_of_everything"}]}]}]},{"id":"section--03-web-development","label":"Web Development","kind":"section","status":"current","def":"","children":[{"id":"03-web-development--front-end-development","label":"Front-End Development","kind":"section","status":"current","children":[{"id":"html-css","label":"HTML/CSS","status":"current","children":[{"id":"html5","label":"HTML5","status":"current","def":"The latest version of HTML, providing new elements, attributes, and behaviors.","links":[{"label":"Official Documentation","url":"https://www.w3.org/TR/html5/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/HTML5"}]},{"id":"css3","label":"CSS3","status":"current","def":"The latest evolution of the Cascading Style Sheets language, providing new features for layout, animation, and more.","links":[{"label":"Official Documentation","url":"https://www.w3.org/Style/CSS/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/CSS"},{"label":"YouTube Resource CS50","url":"https://youtu.be/zFZrkCIc2Oc?si=IwtOYBIeU0pHk-Ht"}],"children":[{"id":"scss","label":"SCSS (Sassy CSS)","status":"current","def":"SCSS is a syntax of SASS (Syntactically Awesome Style Sheets), a CSS preprocessor that extends the capabilities of CSS. It allows developers to use variables, nested rules, mixins, and functions, making CSS more maintainable, reusable, and easier to write. SCSS is fully compatible with the original CSS syntax, making it a more powerful way to organize and streamline stylesheets in web development projects.","links":[{"label":"Official Website","url":"https://sass-lang.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Sass_(stylesheet_language)"}]},{"id":"bootstrap","label":"Bootstrap","status":"current","def":"Bootstrap is a popular open-source front-end framework used for developing responsive and mobile-first websites. It provides a collection of HTML, CSS, and JavaScript components that simplify the development of web pages with a consistent layout and design. Bootstrap includes pre-designed components like navigation bars, buttons, forms, and grids, which allow developers to quickly build visually appealing and functional interfaces across different device sizes.","links":[{"label":"Official Website","url":"https://getbootstrap.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Bootstrap_(front-end_framework)"}]},{"id":"tailwind-css","label":"Tailwind CSS","status":"current","def":"A utility-first CSS framework: instead of writing custom stylesheets, you compose small single-purpose classes directly in the markup. It takes the opposite approach to component frameworks like Bootstrap, trading readable HTML for the removal of the naming and dead-CSS problems that grow with a hand-written stylesheet.","rel":["bootstrap"],"links":[{"label":"Official Website","url":"https://tailwindcss.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Tailwind_CSS"}]},{"id":"css-grid","label":"CSS Grid Layout","status":"current","def":"A two-dimensional layout system that positions elements in rows and columns declared on the container. It replaced the float- and table-based hacks that page layout previously required, and complements Flexbox, which handles one dimension at a time.","links":[{"label":"CSS Grid Layout Module","url":"https://www.w3.org/TR/css-grid-1/"},{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout"}]},{"id":"container-queries","label":"Container Queries","status":"emerging","def":"Styling rules that respond to the size of a component's own container rather than the size of the viewport. This is what media queries could never express: a genuinely reusable component that adapts wherever it is placed, without knowing anything about the page around it.","links":[{"label":"CSS Containment Module Level 3","url":"https://www.w3.org/TR/css-contain-3/"},{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries"}]}]}]},{"id":"javascript","label":"JavaScript","status":"current","children":[{"id":"es6-features","label":"ES6+ features","status":"current","def":"ECMAScript 6 (ES6) and later editions brought significant improvements to JavaScript, including new syntax and features.","links":[{"label":"Official Documentation","url":"https://www.ecma-international.org/publications-and-standards/standards/ecma-262/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/ECMAScript"}]},{"id":"dom-manipulation","label":"DOM Manipulation","status":"current","def":"The ability to interact with and update the Document Object Model (DOM) of a web page using JavaScript.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Document_Object_Model"},{"label":"YouTube Resource CS50","url":"https://youtu.be/jrBhi8wbzPw?si=VBfKr147HqnytXIk"}]},{"id":"typescript","label":"TypeScript","status":"current","def":"A typed superset of JavaScript that compiles to plain JavaScript. Types are checked before the code runs and then erased, so TypeScript catches a whole class of errors at build time while shipping ordinary JavaScript to the browser. It is now the default choice for large front-end and Node codebases.","links":[{"label":"Official Website","url":"https://www.typescriptlang.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/TypeScript"}]},{"id":"esm","label":"ES Modules (ESM)","status":"current","def":"JavaScript's standard module system, using `import` and `export`. Browsers and Node both support it natively, which ended the long split between competing module formats such as CommonJS and AMD.","rel":["es6-features"],"links":[{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules"},{"label":"ECMAScript Modules","url":"https://tc39.es/ecma262/#sec-modules"}],"children":[{"id":"import-maps","label":"Import Maps","status":"emerging","def":"A JSON block in the page that tells the browser how to resolve bare module names such as `import 'lodash'` to real URLs. It allows a project to use named imports directly in the browser without a bundler rewriting them first.","links":[{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap"},{"label":"HTML Standard — import maps","url":"https://html.spec.whatwg.org/multipage/webappapis.html#import-maps"}]}]}]},{"id":"frameworks-and-libraries","label":"Frameworks and Libraries","status":"current","children":[{"id":"jquery","label":"jQuery","status":"legacy","def":"A fast, small, and feature-rich JavaScript library that simplifies HTML DOM tree traversal and manipulation.","rel":["dom-manipulation"],"links":[{"label":"Official Website","url":"https://jquery.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/JQuery"}]},{"id":"react-js","label":"React.js","status":"current","def":"A JavaScript library for building user interfaces, maintained by Facebook and a community of developers.","links":[{"label":"Official Website","url":"https://reactjs.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/React_(JavaScript_library)"}]},{"id":"angular","label":"Angular","status":"current","def":"A TypeScript-based framework for building dynamic web applications, developed by Google. Angular provides a complete solution out of the box, including routing, forms, HTTP client, and dependency injection.","rel":["angularjs"],"links":[{"label":"Official Website","url":"https://angular.dev/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Angular_(web_framework)"}]},{"id":"angularjs","label":"AngularJS","status":"legacy","def":"The original JavaScript framework released by Google in 2010, superseded by Angular (above) and no longer maintained since January 2022. It is listed here because a large amount of older tutorial material still refers to it; note that AngularJS and Angular are distinct frameworks and are not compatible.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/AngularJS"}]},{"id":"vue-js","label":"Vue.js","status":"current","def":"Vue.js is a progressive JavaScript framework used for building user interfaces and single-page applications. It is designed to be incrementally adoptable, meaning you can start with as little or as much of Vue as you like and scale up from there. Vue.js is known for its simplicity, flexibility, and ease of integration with other libraries or existing projects.","links":[{"label":"Official Website","url":"https://vuejs.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Vue.js"}]},{"id":"svelte","label":"Svelte","status":"current","def":"A UI framework that shifts most of its work to build time: components compile into direct DOM-updating JavaScript, so no framework runtime or virtual DOM ships to the browser.","links":[{"label":"Official Website","url":"https://svelte.dev/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Svelte"}]},{"id":"meta-frameworks","label":"Meta-Frameworks","status":"current","def":"Frameworks built on top of a UI library to supply what an application needs beyond rendering components: routing, data loading, server-side rendering, build configuration and deployment. They are where most production front-end work now starts.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_framework"}],"children":[{"id":"next-js","label":"Next.js","status":"current","def":"The most widely used React meta-framework, providing file-based routing, server-side and static rendering, and server components in one toolchain.","rel":["react-js"],"links":[{"label":"Official Website","url":"https://nextjs.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Next.js"}]},{"id":"nuxt","label":"Nuxt","status":"current","def":"The equivalent meta-framework for Vue, adding routing, rendering modes and a module ecosystem on top of Vue's component model.","rel":["vue-js"],"links":[{"label":"Official Website","url":"https://nuxt.com/"}]},{"id":"sveltekit","label":"SvelteKit","status":"current","def":"Svelte's official application framework, handling routing, data loading and the choice between server rendering, prerendering and client rendering per route.","rel":["svelte"],"links":[{"label":"Official Documentation","url":"https://svelte.dev/docs/kit/introduction"}]},{"id":"remix","label":"Remix","status":"current","def":"A React framework built around web platform fundamentals — HTML forms, HTTP caching and nested routing — rather than around client-side state management.","rel":["react-js"],"links":[{"label":"Official Website","url":"https://remix.run/"}]},{"id":"astro","label":"Astro","status":"current","def":"A framework aimed at content-heavy sites. It ships zero JavaScript by default and hydrates only the components you mark as interactive, and it can mix React, Vue and Svelte components in one project.","rel":["hydration","jamstack"],"links":[{"label":"Official Website","url":"https://astro.build/"}]}]},{"id":"htmx","label":"htmx","status":"current","def":"A small library that lets HTML attributes issue AJAX requests and swap the returned HTML into the page. It deliberately inverts the single-page-app model: the server keeps rendering HTML, and very little application state lives in the browser.","rel":["spas"],"links":[{"label":"Official Website","url":"https://htmx.org/"}]}]},{"id":"browsers","label":"Browsers","status":"current","def":"Web browsers are software applications used to access, retrieve, and display content from the World Wide Web. Browsers interpret HTML, CSS, and JavaScript to render web pages and provide a user interface for interacting with online content. Popular browsers include Google Chrome, Mozilla Firefox, Microsoft Edge, and Safari.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_browser"}],"children":[{"id":"developer-mode","label":"Developer Mode","status":"current","def":"Developer Mode, or Developer Tools, is a set of tools provided by web browsers that allow developers to inspect and debug web applications directly in the browser. Developer Mode includes features like the Elements panel for inspecting HTML and CSS, the Console for running JavaScript, and the Network panel for analyzing HTTP requests.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Web_development_tools"},{"label":"MDN Web Docs - Browser Developer Tools","url":"https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_are_browser_developer_tools"}]},{"id":"client-side","label":"Client-Side","status":"current","def":"Client-side refers to operations that are performed by the client, which in most cases is the user's web browser. Client-side technologies include HTML, CSS, and JavaScript, which are executed on the user's device rather than on the server. This approach allows for dynamic user interfaces and interactive web experiences.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Client-side"}]}]},{"id":"build-tooling","label":"Build Tooling","status":"current","def":"The programs that turn source files into what the browser actually loads: resolving modules, compiling TypeScript and JSX, bundling, minifying, and serving a fast development server with hot reloading.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Build_automation"}],"children":[{"id":"vite","label":"Vite","status":"current","def":"The de facto standard front-end build tool. In development it serves native ES modules so startup stays near-instant regardless of project size, and for production it bundles with Rollup.","rel":["esm"],"links":[{"label":"Official Website","url":"https://vite.dev/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Vite_(software)"}]},{"id":"esbuild","label":"esbuild","status":"current","def":"A JavaScript and TypeScript bundler written in Go, one to two orders of magnitude faster than the earlier JavaScript-based bundlers. Several other tools use it internally rather than reimplementing the work.","links":[{"label":"Official Website","url":"https://esbuild.github.io/"}]}]}]},{"id":"03-web-development--back-end-development","label":"Back-End Development","kind":"section","status":"current","children":[{"id":"server-side-programming","label":"Server-Side Programming","status":"current","children":[{"id":"oop","label":"OOP (Object-Oriented Programming)","status":"current","def":"OOP is a programming paradigm based on the concept of \"objects,\" which are instances of classes. Objects can contain data in the form of fields (attributes or properties) and code in the form of methods (functions). OOP emphasizes principles such as encapsulation, inheritance, polymorphism, and abstraction, allowing for the creation of reusable and modular code. This paradigm is widely used in languages like Java, C++, Python, and JavaScript for building scalable and maintainable applications.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Object-oriented_programming"}]},{"id":"python-php","label":"Python/PHP","status":"current","children":[{"id":"python","label":"Python","status":"current","def":"A versatile, high-level programming language widely used for web development, among other applications.","links":[{"label":"Official Website","url":"https://www.python.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Python_(programming_language)"},{"label":"YouTube Resource CS50","url":"https://youtu.be/EOLPQdVj5Ac?si=ZenEOd-cywwXkpIE"}]},{"id":"php","label":"PHP","status":"current","def":"A popular server-side scripting language designed for web development but also used as a general-purpose programming language.","links":[{"label":"Official Website","url":"https://www.php.net/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/PHP"}]}]},{"id":"node-js","label":"Node.js","status":"current","def":"A JavaScript runtime built on Chrome's V8 engine, designed for building scalable network applications.","links":[{"label":"Official Website","url":"https://nodejs.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Node.js"}]},{"id":"deno","label":"Deno","status":"current","def":"A JavaScript and TypeScript runtime from Node's original creator, addressing design regrets in Node: TypeScript runs without a build step, and file, network and environment access are denied unless explicitly granted.","rel":["node-js","typescript"],"links":[{"label":"Official Website","url":"https://deno.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Deno_(software)"}]},{"id":"bun","label":"Bun","status":"current","def":"A JavaScript runtime built on JavaScriptCore that also bundles a package manager, test runner and bundler into one binary, competing with Node primarily on startup and install speed.","rel":["node-js"],"links":[{"label":"Official Website","url":"https://bun.sh/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Bun_(software)"}]}]},{"id":"databases-2","label":"Databases","status":"current","children":[{"id":"sql","label":"SQL","status":"current","def":"Structured Query Language (SQL) is a standardized language for managing and manipulating relational databases.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/SQL"},{"label":"YouTube Resource CS50","url":"https://youtu.be/YzP164YANAU?si=HygcU6En3Zr4NgB2"}]},{"id":"nosql","label":"NoSQL","status":"current","def":"A class of database management systems that do not follow all the rules of a relational database; it is often used for large-scale data storage.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/NoSQL"}]},{"id":"graph-databases","label":"Graph Databases","status":"current","def":"A graph database is a type of NoSQL database that uses graph structures with nodes, edges, and properties to represent and store data. It is optimized for handling data with complex relationships and is particularly useful in applications like social networks, recommendation engines, and fraud detection. Nodes represent entities, while edges represent the relationships between those entities, making querying and navigating complex interconnected data efficient.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Graph_database"}]},{"id":"vector-databases","label":"Vector Databases","status":"current","def":"Vector databases are specialized databases designed to store, index, and query high-dimensional vectors. These databases are crucial for machine learning applications, particularly for similarity search, where the goal is to find vectors that are most similar to a given query vector. Vector databases are used in contexts such as recommendation systems, natural language processing, and computer vision.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Vector_space_model"}]},{"id":"big-data","label":"Big Data","status":"current","def":"Refers to extremely large data sets that require advanced tools and techniques to process and analyze. It is characterized by its volume, variety (types of data), velocity (speed of processing), and veracity (data accuracy). Big Data is used to uncover insights and patterns in fields like finance, healthcare, and social media.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Big_data"}]}]},{"id":"web-frameworks","label":"Web Frameworks","status":"current","children":[{"id":"flask","label":"Flask","status":"current","def":"A lightweight WSGI web application framework in Python. It is designed to make getting started quick and easy, with the ability to scale up to complex applications.","links":[{"label":"Official Website","url":"https://flask.palletsprojects.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Flask_(web_framework)"},{"label":"Training Course - Pluralsight Path","url":"https://drive.google.com/drive/folders/1ZGhmS15qIsTIGGgA5kFigI7AawwHx3Ga"}]},{"id":"django","label":"Django","status":"current","def":"A high-level Python web framework that encourages rapid development and clean, pragmatic design.","links":[{"label":"Official Website","url":"https://www.djangoproject.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Django_(web_framework)"},{"label":"YouTube Resource CS50","url":"https://youtu.be/w8q0C-C1js4?si=fFhDvSuZkNwZK5IO"},{"label":"Training Course - Pluralsight Path","url":"https://drive.google.com/drive/folders/1tvsKwBmeNwwegdx5YJQGvzZnEK-GKZnx"}]}]},{"id":"web-services-and-apis","label":"Web Services and APIs","status":"current","children":[{"id":"websockets","label":"WebSockets","status":"current","def":"A protocol that provides full-duplex communication channels over a single TCP connection, primarily used for real-time applications.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/WebSocket"}]},{"id":"restful-apis","label":"RESTful APIs","status":"current","def":"Representational State Transfer (REST) is an architectural style for designing networked applications, allowing communication between client and server.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Representational_state_transfer"}]}]}]},{"id":"03-web-development--full-stack-development","label":"Full Stack Development","kind":"section","status":"current","children":[{"id":"odoo-framework","label":"Odoo Framework","status":"current","def":"An open-source suite of business applications, including CRM, e-commerce, billing, accounting, manufacturing, warehouse, project management, and inventory management.","links":[{"label":"Official Website","url":"https://www.odoo.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Odoo"}],"children":[{"id":"erp-systems","label":"ERP Systems","status":"current","def":"Enterprise Resource Planning (ERP) systems are integrated management systems that allow organizations to manage business processes in a centralized system.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Enterprise_resource_planning"}]},{"id":"mvc","label":"MVC","status":"current","def":"Model-View-Controller (MVC) is a design pattern used for developing web applications. It divides an application into three interconnected components.","rel":["django","flask"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Model–view–controller"}]},{"id":"orm","label":"ORM (Object-Relational Mapping)","status":"current","def":"ORM is a programming technique that allows developers to interact with a relational database using the object-oriented paradigm. In ORM, objects in a programming language are mapped to database tables, and relationships between objects are managed through associations in the code rather than direct SQL queries. ORMs help simplify database interactions, improve code maintainability, and provide abstraction from the underlying database structure. Popular ORM frameworks include Hibernate for Java, Django ORM for Python, and Sequelize for Node.js.","rel":["oop","sql"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Object-relational_mapping"}]},{"id":"owl-odoo-web-library","label":"OWL (Odoo Web Library)","status":"current","def":"Odoo's own component framework, used to build the web client interface. Not to be confused with OWL the Web Ontology Language, a W3C semantic web standard that shares the acronym but is unrelated.","links":[{"label":"Odoo Documentation","url":"https://www.odoo.com/documentation/15.0/developer/reference/addons/orm.html"}]},{"id":"templating-engines","label":"Templating Engines","status":"current","children":[{"id":"qweb","label":"QWeb","status":"current","def":"A template engine in Odoo used to generate XML/HTML from model data. It allows for the creation of dynamic content in Odoo applications, supporting the rendering of reports, views, and other templates.","links":[{"label":"Odoo Documentation","url":"https://www.odoo.com/documentation/15.0/developer/reference/addons/qweb.html"}]}]}]},{"id":"ides","label":"IDEs (Integrated Development Environments)","status":"current","children":[{"id":"vs-code","label":"VS Code","status":"current","def":"Visual Studio Code (VS Code) is a free, open-source code editor developed by Microsoft. It offers support for debugging, embedded Git control, syntax highlighting, intelligent code completion, snippets, and code refactoring.","links":[{"label":"Official Website","url":"https://code.visualstudio.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Visual_Studio_Code"}]},{"id":"pycharm","label":"PyCharm","status":"current","def":"PyCharm is a dedicated Python IDE developed by JetBrains. It provides essential tools for productive Python development, including code analysis, a graphical debugger, an integrated unit tester, and integration with version control systems.","links":[{"label":"Official Website","url":"https://www.jetbrains.com/pycharm/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/PyCharm"}]}]}]},{"id":"03-web-development--web-security","label":"Web Security","kind":"section","status":"current","children":[{"id":"threats","label":"Threats","status":"current","def":"Refer to the various vulnerabilities and attacks that can compromise the security of web applications, systems, and user data. These threats can exploit weaknesses in software, hardware, or human behavior, leading to unauthorized access, data breaches, or service disruptions. Some common web security threats include:","children":[{"id":"xss","label":"XSS (Cross-Site Scripting)","status":"current","def":"An attack where malicious scripts are injected into trusted websites, enabling attackers to steal user data or hijack user sessions.","rel":["dom-manipulation"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Cross-site_scripting"}]},{"id":"sql-injection","label":"SQL Injection","status":"current","def":"A code injection technique that exploits vulnerabilities in web applications by inserting malicious SQL queries, allowing attackers to access, modify, or delete database data.","rel":["sql"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/SQL_injection"}]},{"id":"csrf","label":"CSRF (Cross-Site Request Forgery)","status":"current","def":"A type of attack where a malicious website tricks a user's browser into performing actions on another site without their consent, leading to unauthorized transactions or data changes.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Cross-site_request_forgery"}]},{"id":"ddos","label":"DDoS (Distributed Denial of Service)","status":"current","def":"An attack that overwhelms a website or server with a flood of internet traffic from multiple sources, making it unavailable to legitimate users.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Denial-of-service_attack"}]},{"id":"phishing","label":"Phishing","status":"current","def":"A type of social engineering attack where attackers disguise themselves as trustworthy entities to steal sensitive information like usernames, passwords, or credit card details.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Phishing"}]}]},{"id":"defenses","label":"Defenses","status":"current","def":"The mechanisms that protect against the threats above. Security on the web is layered: transport encryption, strong authentication, and browser-enforced policies that limit what a page is permitted to load or reach.","rel":["threats"],"links":[{"label":"MDN Web Security","url":"https://developer.mozilla.org/en-US/docs/Web/Security"}],"children":[{"id":"tls-https","label":"TLS / HTTPS","status":"current","def":"Transport Layer Security encrypts and authenticates the connection between browser and server, so traffic cannot be read or altered in transit. HTTPS is HTTP carried over TLS, and is now a prerequisite for most browser features.","rel":["http-https"],"links":[{"label":"RFC 8446 (TLS 1.3)","url":"https://datatracker.ietf.org/doc/html/rfc8446"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Transport_Layer_Security"}]},{"id":"webauthn-passkeys","label":"WebAuthn and Passkeys","status":"current","def":"A standard for signing in with public-key cryptography instead of a shared secret. The private key never leaves the user's device, so there is no password for a site to leak or an attacker to phish. Passkeys are WebAuthn credentials synchronised across a user's devices.","rel":["phishing"],"links":[{"label":"Web Authentication Level 2","url":"https://www.w3.org/TR/webauthn-2/"},{"label":"passkeys.dev","url":"https://passkeys.dev/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/WebAuthn"}]},{"id":"content-security-policy","label":"CSP (Content Security Policy)","status":"current","def":"An HTTP header by which a page declares which sources it may load scripts, styles and other resources from. The browser enforces it, which turns most cross-site scripting from a full compromise into a blocked request.","rel":["xss"],"links":[{"label":"CSP Level 3","url":"https://www.w3.org/TR/CSP3/"},{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP"}]},{"id":"cors","label":"CORS (Cross-Origin Resource Sharing)","status":"current","def":"The mechanism by which a server opts in to being read by pages from other origins. It relaxes the same-origin policy in a controlled way; it is a permission system, not a restriction imposed on the server.","rel":["restful-apis"],"links":[{"label":"MDN Web Docs","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Cross-origin_resource_sharing"}]}]}]}]},{"id":"section--04-additional-topics","label":"Additional Topics","kind":"section","status":"current","def":"","children":[{"id":"04-additional-topics--version-control","label":"Version Control","kind":"section","status":"current","children":[{"id":"git","label":"Git","status":"current","def":"A distributed version-control system for tracking changes in source code during software development.","links":[{"label":"Official Website","url":"https://git-scm.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Git"},{"label":"YouTube Resource CS50","url":"https://youtu.be/NcoBAfJ6l2Q?si=W8uoDwk_akNihWOF"}]},{"id":"github","label":"GitHub","status":"current","def":"A code hosting platform for version control and collaboration, allowing developers to manage and store their code using Git.","links":[{"label":"Official Website","url":"https://github.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/GitHub"}]}]},{"id":"04-additional-topics--deployment","label":"Deployment","kind":"section","status":"current","children":[{"id":"virtualization","label":"Virtualization","status":"current","def":"Virtualization is the process of creating virtual instances of physical resources, such as servers, storage, or networks. By using software like hypervisors, multiple virtual machines (VMs) can run on a single physical machine, optimizing resource use and providing flexibility in cloud environments. Virtualization is a key technology in cloud computing, enabling efficient allocation of computing resources and isolation of environments for security and scalability.","rel":["docker"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Virtualization"}]},{"id":"cloud-computing","label":"Cloud Computing","status":"current","def":"Cloud computing delivers computing services—such as servers, storage, databases, and software—over the internet. It offers flexibility, scalability, and cost-efficiency, eliminating the need for on-premise infrastructure. Main service models include: Cloud computing is essential for modern web development, offering resources on demand.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Cloud_computing"}],"children":[{"id":"iaas","label":"IaaS (Infrastructure as a Service)","status":"current","def":"Virtualized computing resources like servers and storage (e.g., AWS EC2, Azure)."},{"id":"paas","label":"PaaS (Platform as a Service)","status":"current","def":"Platforms for developing and running applications without managing infrastructure (e.g., Google App Engine, Heroku)."},{"id":"saas","label":"SaaS (Software as a Service)","status":"current","def":"Software delivered via the internet, usually on a subscription basis (e.g., Google Workspace, Salesforce)."},{"id":"heroku","label":"Heroku","status":"legacy","def":"A cloud platform as a service (PaaS) supporting several programming languages, used for deploying, managing, and scaling applications.","links":[{"label":"Official Website","url":"https://www.heroku.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Heroku"}]},{"id":"aws","label":"AWS","status":"current","def":"Amazon Web Services (AWS) offers a suite of cloud computing services that make up an on-demand computing platform.","links":[{"label":"Official Website","url":"https://aws.amazon.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Amazon_Web_Services"}]},{"id":"gcp","label":"GCP","status":"current","def":"Google Cloud Platform (GCP) is a suite of cloud computing services offered by Google. It provides a range of services for computing, storage, data analytics, machine learning, and application development, all running on the same infrastructure that Google uses internally for its products like Google Search and YouTube. GCP enables businesses to build, deploy, and scale applications efficiently on a global network.","links":[{"label":"Official Website","url":"https://cloud.google.com/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Google_Cloud_Platform"}]}]}]},{"id":"04-additional-topics--performance-optimization","label":"Performance Optimization","kind":"section","status":"current","children":[{"id":"seo","label":"SEO","status":"current","def":"Search Engine Optimization are set of practices for increasing the quantity and quality of traffic to your website through organic search engine results.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Search_engine_optimization"}]},{"id":"caching","label":"Caching","status":"current","def":"The process of storing copies of files in a cache, or temporary storage location, so they can be accessed more quickly.","rel":["http-https"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Cache_(computing)"}]},{"id":"minification","label":"Minification","status":"current","def":"The process of removing unnecessary characters from code to reduce its size, improving load times and performance.","rel":["esbuild","vite"],"links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Minification_(programming)"}]},{"id":"core-web-vitals","label":"Core Web Vitals","status":"current","def":"Google's set of field metrics for user-perceived performance, measured on real visits rather than in a lab. They give the vaguer goal of \"make it fast\" three specific numbers to move, and they feed into search ranking.","rel":["seo","caching"],"links":[{"label":"web.dev — Web Vitals","url":"https://web.dev/articles/vitals"}],"children":[{"id":"lcp","label":"LCP (Largest Contentful Paint)","status":"current","def":"How long until the largest element in the viewport has rendered — a proxy for when the page looks loaded to the person waiting.","links":[{"label":"web.dev — LCP","url":"https://web.dev/articles/lcp"}]},{"id":"inp","label":"INP (Interaction to Next Paint)","status":"current","def":"How long the page takes to visibly respond to user input, across the whole visit. It replaced First Input Delay, which only measured the first interaction and so missed most of the problem.","links":[{"label":"web.dev — INP","url":"https://web.dev/articles/inp"}]},{"id":"cls","label":"CLS (Cumulative Layout Shift)","status":"current","def":"How much visible content moves around unexpectedly while loading — the metric for the page that shifts just as you go to tap something.","links":[{"label":"web.dev — CLS","url":"https://web.dev/articles/cls"}]}]}]},{"id":"04-additional-topics--emerging-technologies","label":"Emerging Technologies","kind":"section","status":"current","children":[{"id":"webassembly","label":"WebAssembly","status":"current","def":"WebAssembly (Wasm) is a binary instruction format for a stack-based virtual machine, enabling high-performance applications on web pages. It is designed as a portable compilation target for programming languages, enabling deployment on the web for client and server applications.","rel":["javascript"],"links":[{"label":"Official Website","url":"https://webassembly.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/WebAssembly"}]},{"id":"graphql","label":"GraphQL","status":"current","def":"GraphQL is a query language for your API, and a server-side runtime for executing queries by using a type system you define for your data. It provides a more efficient, powerful, and flexible alternative to REST.","rel":["restful-apis"],"links":[{"label":"Official Website","url":"https://graphql.org/"},{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/GraphQL"}]},{"id":"hydration","label":"Hydration","status":"current","def":"Hydration is a technique used in web development, particularly in Single Page Applications (SPAs), where server-rendered HTML is enhanced with client-side JavaScript. This allows the page to become interactive by \"hydrating\" static content with dynamic behavior without requiring a full page reload.","links":[{"label":"Wikipedia","url":"https://en.m.wikipedia.org/wiki/Hydration_(web_development)"}],"children":[{"id":"spas","label":"SPAs (Single Page Applications)","status":"current","def":"SPAs are web applications that load a single HTML page and dynamically update content as the user interacts with the app. This provides a seamless user experience by eliminating the need for full page reloads. Examples of SPAs include Gmail and Google Maps.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Single-page_application"}]}]},{"id":"jamstack","label":"JAMStack","status":"current","def":"JAMStack (JavaScript, APIs, and Markup) is a modern web development architecture that decouples the front-end from the back-end. It involves building fast, secure web apps with pre-rendered static files served over a CDN, while APIs handle dynamic functionality. JAMStack enhances performance and scalability.","links":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/Jamstack"}]},{"id":"webgpu","label":"WebGPU","status":"emerging","def":"A browser API exposing modern GPU capability for both rendering and general computation, succeeding WebGL. It makes serious graphics work and in-browser machine-learning inference practical on the web platform.","links":[{"label":"WebGPU","url":"https://www.w3.org/TR/webgp
