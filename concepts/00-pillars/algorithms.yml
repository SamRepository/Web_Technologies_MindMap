definition: Algorithms are sets of instructions or rules designed to perform specific tasks or solve problems
  efficiently. They are the foundation of programming and automation in computing.
definition_ar: >-
  الخوارزميات هي مجموعات من التعليمات أو القواعد المصمَّمة لأداء مهامّ محدَّدة أو حلّ المشكلات
  بكفاءة. وهي أساس البرمجة (programming) والأتمتة (automation) في الحوسبة.
