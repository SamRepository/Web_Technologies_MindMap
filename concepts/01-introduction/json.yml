definition: JavaScript Object Notation (JSON) is a lightweight data-interchange format that is easy for
  humans to read and write, and easy for machines to parse and generate.
definition_ar: >-
  ترميز كائنات جافاسكريبت (JSON) صيغة خفيفة لتبادل البيانات، يسهل على الإنسان قراءتها
  وكتابتها، وعلى الآلة تحليلها وتوليدها.
